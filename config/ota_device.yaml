# OTA设备端配置文件

# 服务器配置
server:
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883
  mqtt_protocol: "tcp"
  http_host: "127.0.0.1"
  http_port: 8020

# 设备列表
devices:
  # 设备1 - 类型1
  - device_no: 1
    device_type: 1
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_protocol: "tcp"
    http_host: "127.0.0.1"
    http_port: 8020
    components:
      - name: "gps"
        version: "1.0.0"
      - name: "mcu"
        version: "1.0.0"

  # 设备2 - 类型1
  - device_no: 2
    device_type: 2
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_protocol: "tcp"
    http_host: "127.0.0.1"
    http_port: 8020
    components:
      - name: "gps"
        version: "1.0.0"
      - name: "app"
        version: "2.0.0"

  # 设备3 - 类型2
  - device_no: 3
    device_type: 3
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_protocol: "tcp"
    http_host: "127.0.0.1"
    http_port: 8020
    components:
      - name: "gps"
        version: "1.0.0"
      - name: "firmware"
        version: "3.0.0"
