<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>OTA 管理页面（紧凑版）</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
      background: #f5f5f5;
      color: #333;
    }

    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }

    .section {
      background: white;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
      min-width: 150px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 6px 12px;
      font-size: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover {
      background: #0056b3;
    }

    pre {
      background: #eee;
      padding: 8px 10px;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.4;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>🔔 通知 OTA</h2>
    <div class="row">
      <input id="notify_type" placeholder="设备类型（如 1）" />
      <input id="notify_name" placeholder="文件名（如 agsspds）" />
      <input id="notify_version" placeholder="版本号（如 6.0.0.1）" />
    </div>
    <button onclick="notify()">发送通知</button>
  </div>

  <div class="section">
    <h2>🔍 查询设备版本</h2>
    <div class="row">
      <input id="query_type" placeholder="设备类型" />
      <input id="query_no" placeholder="设备编号" />
      <input id="query_name" placeholder="文件名" />
    </div>
    <button onclick="query()">查询</button>
  </div>

  <div class="section">
    <h2>📥 查询下载状态</h2>
    <div class="row">
      <input id="dl_type" placeholder="设备类型" />
      <input id="dl_no" placeholder="设备编号" />
      <input id="dl_name" placeholder="文件名" />
    </div>
    <button onclick="queryDownload()">查询下载进度</button>
  </div>

  <div class="section">
    <h2>📦 下载文件</h2>
    <div class="row">
      <input id="down_type" placeholder="设备类型" />
      <input id="down_name" placeholder="文件名" />
      <input id="down_version" placeholder="版本号" />
    </div>
    <button onclick="download()">开始下载</button>
  </div>

  <div class="section">
    <h2>📄 响应结果</h2>
    <pre id="output">等待操作...</pre>
  </div>

<script>
  const api = "http://156.225.19.170:8020";

  function show(data) {
    document.getElementById("output").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  async function notify() {
    const body = {
      command: "notify",
      device_type: parseInt(document.getElementById("notify_type").value),
      name: document.getElementById("notify_name").value,
      version: document.getElementById("notify_version").value
    };
    const res = await fetch(api + "/ota/notify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    show(await res.json());
  }

  async function query() {
    const body = {
      command: "query",
      device_type: parseInt(document.getElementById("query_type").value),
      device_no: parseInt(document.getElementById("query_no").value),
      action: "getVersion",
      name: document.getElementById("query_name").value
    };
    const res = await fetch(api + "/ota/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    show(await res.json());
  }

  async function queryDownload() {
    const body = {
      device_type: parseInt(document.getElementById("dl_type").value),
      device_no: parseInt(document.getElementById("dl_no").value),
      name: document.getElementById("dl_name").value
    };
    const res = await fetch(api + "/ota/query_download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    show(await res.json());
  }

  function download() {
    const type = document.getElementById("down_type").value;
    const name = document.getElementById("down_name").value;
    const version = document.getElementById("down_version").value;
    const url = `${api}/ota/file_download/${type}/${name}/${version}`;
    window.open(url, "_blank");
    show("已触发下载：" + url);
  }
</script>

</body>
</html>
